name: Test - e2e

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      levainVersion:
        description: "Published Levain version (optional - Default=latest; ignored when buildFromRef=true)"
        required: false
      buildFromRef:
        description: "Build and test Levain from the current branch/ref before tagging a release"
        required: false
        type: boolean
        default: false
      buildMode:
        description: "Runtime variant to test ('compile' = levain.exe, 'bundle' = official deno.exe + levain.bundle.js)"
        required: false
        type: choice
        default: compile
        options:
          - compile
          - bundle
      packages:
        description: "Optional package subset to install (space/comma separated; empty = curated default list in testing/e2e/default-packages.txt)"
        required: false
      denoVersion:
        description: "Deno version for buildFromRef and verification script (optional - Default=2.9.8)"
        required: false
        default: "2.9.8"

  release:
    types: [published]

  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 6 * * SUN"

jobs:
  e2e-win:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Echo
        shell: pwsh
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
          BUILD_FROM_REF: ${{ github.event.inputs.buildFromRef }}
        run: Write-Output "REF=$env:GITHUB_REF_VALUE BUILD_FROM_REF=$env:BUILD_FROM_REF"

      - name: Checkout repository (for verification script and optional branch build)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Levain from current branch (buildFromRef)
        if: ${{ github.event.inputs.buildFromRef == 'true' }}
        shell: pwsh
        env:
          INPUT_DENO_VERSION: ${{ github.event.inputs.denoVersion }}
          INPUT_BUILD_MODE: ${{ github.event.inputs.buildMode || 'compile' }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $denoVer = if ($env:INPUT_DENO_VERSION) { $env:INPUT_DENO_VERSION.Trim() } else { "2.9.8" }
          if ($denoVer -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid denoVersion: $denoVer"
          }
          $buildMode = if ($env:INPUT_BUILD_MODE) { $env:INPUT_BUILD_MODE.Trim() } else { "compile" }
          if ($buildMode -ne "compile" -and $buildMode -ne "bundle") {
            throw "Invalid buildMode: $buildMode"
          }
          & cmd.exe /c "scripts\devLevain.cmd" $denoVer
          if ($LASTEXITCODE -ne 0) { throw "devLevain.cmd failed with exit code $LASTEXITCODE" }

          $targetDir = Join-Path $env:GITHUB_WORKSPACE "target"
          if ($buildMode -eq "bundle") {
            & cmd.exe /c "scripts\levain-build.cmd" --bundle $targetDir
          } else {
            & cmd.exe /c "scripts\levain-build.cmd" $targetDir
          }
          if ($LASTEXITCODE -ne 0) { throw "levain-build.cmd failed with exit code $LASTEXITCODE" }

          $levainHome = Join-Path $HOME "levain"
          $installArgs = @("--addRepo", "https://github.com/$($env:REPOSITORY)-pkgs.git", "--levainHome", $levainHome, "--skip-levain-updates", "--skip-auto-clean", "install", "--force", "levain")
          if ($buildMode -eq "bundle") {
            $builtDeno = Join-Path $targetDir "build\deno.exe"
            $builtBundle = Join-Path $targetDir "build\levain.bundle.js"
            & $builtDeno run --no-check --cached-only --allow-all $builtBundle @installArgs
          } else {
            $builtExe = Join-Path $targetDir "build\levain.exe"
            & $builtExe @installArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "levain install failed with exit code $LASTEXITCODE" }

          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $levainHome "levain")

      - name: Install Levain from published release
        if: ${{ github.event.inputs.buildFromRef != 'true' }}
        shell: pwsh
        env:
          INPUT_LEVAIN_VERSION: ${{ github.event.inputs.levainVersion }}
          INPUT_BUILD_MODE: ${{ github.event.inputs.buildMode || 'compile' }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          # Which levain version?
          # The manual input wins. When triggered by a published release, use
          # that release - it is still flagged as a pre-release at this point,
          # so the "latest" URL would point to the PREVIOUS release.
          $levainVersion = if ($env:INPUT_LEVAIN_VERSION) { $env:INPUT_LEVAIN_VERSION.Trim() } else { "" }
          if (-not $levainVersion -and $env:RELEASE_TAG_NAME) {
            $levainVersion = $env:RELEASE_TAG_NAME -replace '^v', ''
          }
          if ($levainVersion -and $levainVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid levainVersion: $levainVersion"
          }
          $buildMode = if ($env:INPUT_BUILD_MODE) { $env:INPUT_BUILD_MODE.Trim() } else { "compile" }
          if ($buildMode -ne "compile" -and $buildMode -ne "bundle") {
            throw "Invalid buildMode: $buildMode"
          }

          $levainHeadless = "true"
          $levainBundle = if ($buildMode -eq "bundle") { "true" } else { "false" }
          if ($levainVersion) {
            $scriptUrl = "https://github.com/$($env:REPOSITORY)/releases/download/v${levainVersion}/install.ps1"
            Write-Output "=== install.ps1 from $scriptUrl"
            $tmpInstall = Join-Path $env:TEMP "levain-e2e-install.ps1"
            try {
              Invoke-WebRequest -Uri $scriptUrl -OutFile $tmpInstall -UseBasicParsing
              & $tmpInstall
            } finally {
              Remove-Item -LiteralPath $tmpInstall -Force -ErrorAction SilentlyContinue
            }
          } else {
            $localInstall = Join-Path $env:GITHUB_WORKSPACE "install\install.ps1"
            Write-Output "=== install.ps1 from local checkout $localInstall"
            & $localInstall
          }

          # Workaround - ADD Levain to GitHub PATH
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\levain\levain"

      - name: Levain list
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          levain --skip-levain-updates list

      - name: Scan installed Levain with Windows Defender
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\scripts\msDefender.cmd" "%USERPROFILE%\levain\levain"

      - name: Levain install packages
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          $ErrorActionPreference = "Stop"
          $defaultPkgFile = Join-Path $env:GITHUB_WORKSPACE "testing\e2e\default-packages.txt"

          $pkgList = @()
          if ($env:INPUT_PACKAGES -and $env:INPUT_PACKAGES.Trim()) {
            $pkgList = @($env:INPUT_PACKAGES -split '[,\s]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          } else {
            $pkgList = @(
              Get-Content -LiteralPath $defaultPkgFile |
                ForEach-Object { ($_ -replace '#.*$', '').Trim() } |
                Where-Object { $_ } |
                ForEach-Object { $_ -split '[,\s]+' } |
                ForEach-Object { $_.Trim() } |
                Where-Object { $_ }
            )
          }

          if ($pkgList.Count -eq 0) {
            throw "No packages resolved to install."
          }

          foreach ($pkg in $pkgList) {
            if ($pkg -notmatch '^[a-zA-Z0-9._+-]+$') {
              throw "Invalid package name: $pkg"
            }
          }

          # Verify piped `levain list` outputs clean ANSI-free lines and resolves all target packages
          $levainExe = Join-Path $HOME "levain\levain\build\levain.exe"
          $levainDeno = Join-Path $HOME "levain\levain\build\deno.exe"
          $levainBundle = Join-Path $HOME "levain\levain\build\levain.bundle.js"
          if (Test-Path -LiteralPath $levainExe -PathType Leaf) {
            $runtimeBin = $levainExe
            $runtimePrefix = @()
          } elseif ((Test-Path -LiteralPath $levainDeno -PathType Leaf) -and (Test-Path -LiteralPath $levainBundle -PathType Leaf)) {
            $runtimeBin = $levainDeno
            $runtimePrefix = @("run", "--no-check", "--cached-only", "--allow-all", $levainBundle)
          } else {
            throw "Neither compiled levain.exe nor bundled deno.exe + levain.bundle.js found under $HOME\levain\levain\build"
          }

          $listOutput = & $runtimeBin @runtimePrefix --skip-levain-updates --skip-auto-clean list
          if ($LASTEXITCODE -ne 0) {
            throw "levain list failed with exit code $LASTEXITCODE"
          }
          $listed = @($listOutput | Select-String -Pattern '^   [a-zA-Z0-9]' | ForEach-Object { $_.ToString().Trim() })
          if ($listed.Count -eq 0) {
            throw "Piped 'levain list' produced no parseable package lines (possible ANSI escape regression)."
          }
          $missing = @($pkgList | Where-Object { $listed -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "Target E2E packages not found in repository: $($missing -join ', ')"
          }

          Write-Output "=== Installing packages ($($pkgList.Count)): $($pkgList -join ' ')"
          & $runtimeBin @runtimePrefix --skip-levain-updates --skip-auto-clean install @pkgList
          if ($LASTEXITCODE -ne 0) {
            throw "levain install failed with exit code $LASTEXITCODE"
          }

      - name: Levain update
        shell: cmd
        working-directory: ${{ runner.temp }}
        run: |
          levain --skip-levain-updates update

      - name: Verify real Levain effects (CLI, activate in CMD/PowerShell/Git Bash, tools, concurrency)
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          INPUT_LEVAIN_VERSION: ${{ github.event.inputs.levainVersion }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          BUILD_FROM_REF: ${{ github.event.inputs.buildFromRef }}
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
          INPUT_DENO_VERSION: ${{ github.event.inputs.denoVersion }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $denoVer = if ($env:INPUT_DENO_VERSION) { $env:INPUT_DENO_VERSION.Trim() } else { "2.9.8" }
          if ($denoVer -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid denoVersion: $denoVer"
          }

          $denoBinDir = Join-Path $env:GITHUB_WORKSPACE "bin"
          $denoExe = Join-Path $denoBinDir "deno.exe"
          if (-not (Test-Path -LiteralPath $denoExe -PathType Leaf)) {
            New-Item -ItemType Directory -Path $denoBinDir -Force | Out-Null
            & cmd.exe /c (Join-Path $env:GITHUB_WORKSPACE "githubScripts\get-deno.cmd") $denoBinDir $denoVer
            if ($LASTEXITCODE -ne 0) { throw "get-deno.cmd failed with exit code $LASTEXITCODE" }
          }

          $verifyScript = Join-Path $env:GITHUB_WORKSPACE "testing\e2e\verify-e2e.ts"
          $verifyArgs = @("run", "--allow-all", $verifyScript, "--levain-home", "$HOME\levain")

          if ($env:BUILD_FROM_REF -ne "true") {
            $expectedVer = if ($env:INPUT_LEVAIN_VERSION) { $env:INPUT_LEVAIN_VERSION.Trim() } else { "" }
            if (-not $expectedVer -and $env:RELEASE_TAG_NAME) {
              $expectedVer = $env:RELEASE_TAG_NAME -replace '^v', ''
            }
            if ($expectedVer) {
              $verifyArgs += @("--expected-version", $expectedVer)
            }
          }

          if ($env:INPUT_PACKAGES -and $env:INPUT_PACKAGES.Trim()) {
            $pkgs = @($env:INPUT_PACKAGES -split '[,\s]+' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            if ($pkgs.Count -gt 0) {
              $verifyArgs += @("--packages", ($pkgs -join ","))
            }
          }

          & $denoExe @verifyArgs
          if ($LASTEXITCODE -ne 0) {
            throw "verify-e2e.ts failed with exit code $LASTEXITCODE"
          }
