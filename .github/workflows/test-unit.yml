name: Unit tests

on:
  workflow_dispatch:
    inputs:
      denoVersion:
        description: "Deno version (optional)"
        required: false
        default: "2.9.8"

  push:

  pull_request:

  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 5 * * SUN"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DEFAULT_DENO_VERSION: "2.9.8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Deno
        run: |
          rm -rf "$DENO_ROOT_PATH" && mkdir -p "$DENO_ROOT_PATH"
          bash "$GITHUB_WORKSPACE/githubScripts/get-deno.sh" "$DENO_ROOT_PATH" Linux "${{ github.event.inputs.denoVersion || env.DEFAULT_DENO_VERSION }}"
          echo "$DENO_ROOT_PATH" >> "$GITHUB_PATH"
        env:
          DENO_ROOT_PATH: ${{ runner.temp }}/deno

      - name: Typecheck, lint, i18n, and tooling tests
        run: |
          deno --version
          deno check levain.ts
          deno lint
          deno task check:i18n
          deno test --allow-all scripts/ testing/ levain.test.ts

  unit-win:
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      DEFAULT_DENO_VERSION: "2.9.8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Deno version
        id: set-version
        run: |
          echo "DENO_VERSION=${{ github.event.inputs.denoVersion || env.DEFAULT_DENO_VERSION }}" >> $GITHUB_ENV

      - name: Get Deno
        shell: cmd
        env:
          DENO_VERSION: ${{ github.event.inputs.denoVersion || env.DEFAULT_DENO_VERSION }}
          DENO_ROOT_PATH: ${{ runner.temp }}\deno
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          if exist %DENO_ROOT_PATH% rmdir /q/s %DENO_ROOT_PATH%
          if not exist %DENO_ROOT_PATH% mkdir %DENO_ROOT_PATH%
          call %GITHUB_WORKSPACE%\githubScripts\get-deno.cmd %DENO_ROOT_PATH% %DENO_VERSION%

      - name: Get extraBin
        shell: cmd
        run: |
          call %GITHUB_WORKSPACE%\githubScripts\get-extraBin.cmd
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Lint and i18n checks
        shell: cmd
        run: |
          set "PATH=%DENO_ROOT_PATH%;%PATH%"
          deno lint
          if errorlevel 1 exit /b %ERRORLEVEL%
          deno task check:i18n
          if errorlevel 1 exit /b %ERRORLEVEL%
        env:
          DENO_ROOT_PATH: ${{ runner.temp }}\deno

      - name: Run tests
        shell: cmd
        run: |
          set "PATH=%DENO_ROOT_PATH%;%PATH%"
          call "%GITHUB_WORKSPACE%\scripts\test.cmd" --denoDir %DENO_ROOT_PATH% --coverage --checkSources
          if errorlevel 1 exit /b %ERRORLEVEL%
        env:
          DENO_ROOT_PATH: ${{ runner.temp }}\deno
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: coverage/levain.lcov
