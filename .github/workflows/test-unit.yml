name: Unit tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      denoVersion:
        description: "Deno version (optional)"
        required: false
        default: "2.9.8"

  push:

  pull_request:

  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 5 * * SUN"

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DEFAULT_DENO_VERSION: "2.9.8"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Deno version
        id: deno_ver
        env:
          INPUT_DENO_VERSION: ${{ github.event.inputs.denoVersion || env.DEFAULT_DENO_VERSION }}
        run: |
          if [[ ! "$INPUT_DENO_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid DENO_VERSION: $INPUT_DENO_VERSION" >&2
            exit 1
          fi
          echo "version=${INPUT_DENO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "DENO_DIR=${RUNNER_TEMP}/deno-cache" >> "$GITHUB_ENV"

      - name: Cache Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deno-cache
          key: deno-cache-test-unit-${{ runner.os }}-${{ steps.deno_ver.outputs.version }}-${{ hashFiles('deno.lock') }}

      - name: Get Deno
        run: |
          rm -rf "$DENO_ROOT_PATH" && mkdir -p "$DENO_ROOT_PATH"
          bash "$GITHUB_WORKSPACE/githubScripts/get-deno.sh" "$DENO_ROOT_PATH" Linux "$DENO_VERSION"
          echo "$DENO_ROOT_PATH" >> "$GITHUB_PATH"
        env:
          DENO_ROOT_PATH: ${{ runner.temp }}/deno
          DENO_VERSION: ${{ steps.deno_ver.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck, lint, i18n, and tooling tests
        run: |
          deno --version
          deno check --frozen levain.ts
          deno lint
          deno task check:i18n
          deno test --frozen --allow-all scripts/ testing/ levain.test.ts

  unit-win:
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      DEFAULT_DENO_VERSION: "2.9.8"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Deno version
        id: deno_ver
        shell: pwsh
        env:
          INPUT_DENO_VERSION: ${{ github.event.inputs.denoVersion || env.DEFAULT_DENO_VERSION }}
        run: |
          if ($env:INPUT_DENO_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid DENO_VERSION: $env:INPUT_DENO_VERSION"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$env:INPUT_DENO_VERSION"
          Add-Content -Path $env:GITHUB_ENV -Value "DENO_DIR=$env:RUNNER_TEMP\deno-cache"

      - name: Cache Deno dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\deno-cache
          key: deno-cache-test-unit-${{ runner.os }}-${{ steps.deno_ver.outputs.version }}-${{ hashFiles('deno.lock') }}

      - name: Get Deno
        shell: cmd
        env:
          DENO_VERSION: ${{ steps.deno_ver.outputs.version }}
          DENO_ROOT_PATH: ${{ runner.temp }}\deno
          GITHUB_WORKSPACE: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if exist "%DENO_ROOT_PATH%" rmdir /q/s "%DENO_ROOT_PATH%"
          if not exist "%DENO_ROOT_PATH%" mkdir "%DENO_ROOT_PATH%"
          call "%GITHUB_WORKSPACE%\githubScripts\get-deno.cmd" "%DENO_ROOT_PATH%" "%DENO_VERSION%"
          if errorlevel 1 exit /b %ERRORLEVEL%

      - name: Get extraBin
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\githubScripts\get-extraBin.cmd"
          if errorlevel 1 exit /b %ERRORLEVEL%
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Lint and i18n checks
        shell: cmd
        run: |
          set "PATH=%DENO_ROOT_PATH%;%PATH%"
          deno lint
          if errorlevel 1 exit /b %ERRORLEVEL%
          deno task check:i18n
          if errorlevel 1 exit /b %ERRORLEVEL%
        env:
          DENO_ROOT_PATH: ${{ runner.temp }}\deno

      - name: Run tests
        shell: cmd
        run: |
          set "PATH=%DENO_ROOT_PATH%;%PATH%"
          call "%GITHUB_WORKSPACE%\scripts\test.cmd" --denoDir "%DENO_ROOT_PATH%" --coverage --checkSources
          if errorlevel 1 exit /b %ERRORLEVEL%
        env:
          DENO_ROOT_PATH: ${{ runner.temp }}\deno
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: coverage/levain.lcov
