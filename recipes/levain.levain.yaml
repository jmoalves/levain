version: 0.99.5

recipesDir: ${baseDir}/build/recipes

cmd.install:
  - copy --verbose ../../levain.cmd ../../build ${baseDir}
  - copy --verbose ../../levain.ps1 ../../build ${baseDir}
  - copy --verbose ../../levain.sh ../../build ${baseDir}
  - addPath --permanent ${baseDir}/bin
  - addPath --permanent ${baseDir}
